<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayasupe</title>
    <link rel="stylesheet" href="./bayasupe1.css">

    <!--フォント指定-->
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Tint&display=swap" rel="stylesheet">

     
    <style>
        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-around;
        }
        .image-container img {
            width: 200px;
            height: auto;
        } 
        .bungee-tint {
            font-family: 'Bungee Tint', cursive;
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <h1 class="bungee-tint"><ruby>Bayasupe<rt>バヤスぺ</rt></ruby></h1>
        <dd>
            <dt style="color:aliceblue">欲しい画像の説明を入力し生成ボタンを押すと画像生成できます。</dt> 
            <p style="color:aliceblue">128,512,1024は画像サイズです。</p>
            <p style="color:aliceblue">例</p>
            <img id="example" src="" alt="example">
        </dd>

        <!--プロンプト入力欄-->
        <dt>
            <form id="promptForm">

                <label for="prompt">Enter your prompt</label>
                <input type="text" id="prompt" name="prompt" placeholder="sks irasuya, からプロンプトを入力してください">
                <button type="submit">画像生成</button>

            </form>

            
        </dt>
    </div>

    <!--生成した画像を引っ張ってきて表示-->
    <div id="result">
        <img id="generatedImage" src="" alt="Generated Image" style="display:none; max-width:100%;">
        <!--ダウンロードリンク-->
        <a id="downloadlink" href="#" download="downloadImage.jpg" style="display:none;">ダウンロード</a> 
    </div>

    <!-- 画像サイズ変更ボタン-->
    <br>
    <button onclick="resizeImages('small')">128px</button>
    <button onclick="resizeImages('medium')">512px</button>
    <button onclick="resizeImages('large')">1024px</button>
